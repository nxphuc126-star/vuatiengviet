<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giám sát giáo viên · VUA TIẾNG VIỆT</title>
<link rel="stylesheet" href="/assets/css/teacher.css">
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>🔒 Đăng Nhập Giáo Viên</h2>
    <p style="color:#7a6a58; font-size:0.9rem">Vui lòng nhập tài khoản để xem tiến độ học sinh</p>
    <input type="text" id="username" placeholder="Tên đăng nhập">
    <input type="password" id="password" placeholder="Mật khẩu">
    <button onclick="checkLogin()">Đăng Nhập</button>
    <p id="error-msg" class="error-msg">Tài khoản hoặc mật khẩu không đúng!</p>
  </div>
</div>

<div id="main-content">
  <h1>👩‍🏫 Quản Lý Lớp Học</h1>
  <p class="subtitle">Cập nhật real-time · Theo dõi tiến độ học sinh</p>

  <div class="grid">
    <div class="box">
      <h2>📡 Đang làm bài</h2>
      <div id="live-panel">Đang tải dữ liệu...</div>
    </div>
    <div class="box">
      <h2>🏆 Bảng xếp hạng</h2>
      <div id="lb-panel">Đang tải dữ liệu...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, limit, doc, deleteDoc, updateDoc, getDocs }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
import { getAuth, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAsT89zdpQwALQ0kmYta7mtwCXaj_yJc8Q",
  authDomain: "vuatiengviet-7a1cb.firebaseapp.com",
  projectId: "vuatiengviet-7a1cb",
  storageBucket: "vuatiengviet-7a1cb.firebasestorage.app",
  messagingSenderId: "563648012328",
  appId: "1:563648012328:web:9b6bdc3e45179dd90ed51d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

window.checkLogin = async function() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value;
  const error = document.getElementById('error-msg');
  const button = document.querySelector('.login-box button');
  error.style.display = 'none';
  if (!user || !pass) {
    error.textContent = 'Vui lòng nhập đầy đủ tài khoản và mật khẩu.';
    error.style.display = 'block';
    return;
  }
  button.disabled = true;
  button.textContent = 'Đang xác thực...';
  try {
    const response = await fetch('/api/teacher-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const result = await response.json();
    if (!response.ok || !result.token) throw new Error(result.error || 'Thông tin đăng nhập không đúng.');
    const credential = await signInWithCustomToken(auth, result.token);
    if (credential.user.getIdToken) {
      const tokenResult = await credential.user.getIdTokenResult(true);
      if (tokenResult.claims.teacher !== true) throw new Error('Tài khoản không có quyền giáo viên.');
    }
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    startRealtimeData();
  } catch (err) {
    error.textContent = err.message || 'Không thể đăng nhập. Vui lòng thử lại.';
    error.style.display = 'block';
  } finally {
    button.disabled = false;
    button.textContent = 'Đăng Nhập';
  }
};

document.getElementById('password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') window.checkLogin();
});

window.kickStudent = async function(sessionId) {
  if (confirm("Bạn có chắc chắn muốn đuổi học sinh này ra khỏi phòng thi?")) {
    try { await updateDoc(doc(db, "active_sessions", sessionId), { kicked: true }); } 
    catch (e) { alert("Lỗi khi đuổi: " + e.message); }
  }
};

window.warnStudent = async function(sessionId, currentScore) {
  if (confirm("Cảnh báo và TRỪ NỬA SỐ ĐIỂM của học sinh này?")) {
    try {
      const newScore = Math.max(0, Math.floor(currentScore / 2));
      await updateDoc(doc(db, "active_sessions", sessionId), {
        warningMessage: `Giáo viên đã cảnh cáo bạn vì vi phạm! Bạn bị trừ nửa số điểm (Còn ${newScore} điểm).`,
        warningTimestamp: Date.now(),
        score: newScore
      });
    } catch (e) { alert("Lỗi: " + e.message); }
  }
};

window.deleteFromBXH = async function(studentName) {
  if (confirm(`Bạn có chắc chắn muốn XÓA ${studentName} khỏi Bảng Xếp Hạng?`)) {
    try {
      const q = query(collection(db, "leaderboard"));
      const snap = await getDocs(q);
      const matches = snap.docs.filter(d => d.data().name === studentName);
      if (!matches.length) {
        alert("Không tìm thấy học sinh này trên BXH!");
        return;
      }
      await Promise.all(matches.map(d => deleteDoc(doc(db, "leaderboard", d.id))));
    } catch (e) { alert("Lỗi khi xóa: " + e.message); }
  }
};

function startRealtimeData() {
  onSnapshot(collection(db, "active_sessions"), (snap) => {
    const now = new Date();
    const rows = [];
    
    snap.forEach(d => {
      const v = d.data();
      const last = v.lastUpdate?.toDate?.() || new Date(0);
      const diffMinutes = (now - last) / 1000 / 60;
      
      if (v.status === "offline" || v.kicked === true || diffMinutes > 1) {
        deleteDoc(doc(db, "active_sessions", d.id));
        return; 
      }
      
      if (v.status === "playing") {
        const pct = Math.min(100, Math.round((v.currentQuestionIndex / v.totalQuestions) * 100));
        
        let warningHTML = '';
        let nameColor = 'inherit';
        let rowBg = '';
        
        if (v.cheating === true) {
          warningHTML = `<div style="color:#b91c1c; font-size:0.8rem; font-weight:bold; margin-top:4px;">⚠️ Đã chuyển tab!</div>`;
          nameColor = '#b91c1c'; 
          rowBg = 'background-color: #ffebee;'; 
          if (v.cheatingImageUrl) {
            warningHTML += `<div style="margin-top:8px;"><a href="${v.cheatingImageUrl}" target="_blank"><img src="${v.cheatingImageUrl}" style="width:120px; height:90px; border-radius:6px; border:2px solid #b91c1c; object-fit:cover;"></a></div>`;
          }
        }

        const nameParts = v.studentName.split(' (');
        const displayName = nameParts[0];
        const displayClass = nameParts.length > 1 ? nameParts[1].replace(')', '') : '';
        let classBadge = displayClass ? `<span style="background:#c2410c; color:#fff; font-size:0.7rem; padding:2px 8px; border-radius:10px; margin-left:6px; font-weight:bold;">${displayClass}</span>` : '';

        rows.push(`
          <div class="row" style="${rowBg}">
            <div>
              <div class="nm" style="color:${nameColor}; display:flex; align-items:center;">${esc(displayName)} ${classBadge}</div>
              <div class="meta">Câu ${v.currentQuestionIndex}/${v.totalQuestions} · <b>${v.score}</b> điểm</div>
              ${warningHTML}
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
              <div class="progress-container">
                <div class="progress-text">${pct}%</div>
                <div class="progress"><i style="width:${pct}%"></i></div>
              </div>
              <div style="display:flex;">
                <button class="btn-warn" onclick="window.warnStudent('${d.id}', ${v.score})">Cảnh báo</button>
                <button style="background:#b91c1c; color:#fff; border:none; padding:4px 10px; font-size:0.8rem; border-radius:6px; cursor:pointer;" onclick="window.kickStudent('${d.id}')">Đuổi</button>
              </div>
            </div>
          </div>
        `);
      }
    });
    document.getElementById('live-panel').innerHTML = rows.length ? rows.join('') : '<div class="empty">Không có ai đang làm bài.</div>';
  });

  const lbQuery = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
  onSnapshot(lbQuery, (snap) => {
    const rows = []; 
    let rank = 0;
    snap.forEach(d => {
      const v = d.data(); 
      rank++;
      let badgeColor = "#c2410c";
      if (rank === 1) badgeColor = "#eab308";
      if (rank === 2) badgeColor = "#94a3b8";
      if (rank === 3) badgeColor = "#b45309";

      rows.push(`
        <div class="row">
          <div style="display:flex; align-items:center;">
            <span class="badge" style="background:${badgeColor}">#${rank}</span> 
            <span class="nm">${esc(v.name)}</span>
            <button class="btn-del" onclick="window.deleteFromBXH('${esc(v.name)}')">Xóa</button>
          </div>
          <div class="meta" style="text-align:right"><b>${v.score}</b> điểm<br>Đúng ${v.correct}/${v.total}</div>
        </div>
      `);
    });
    document.getElementById('lb-panel').innerHTML = rows.length ? rows.join('') : '<div class="empty">Chưa có ai trên bảng xếp hạng.</div>';
  });
}
</script>
</body>
</html>
