<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giám sát học sinh · VUA TIẾNG VIỆT</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #fff8ec; color: #2b2118; }
  h1 { color: #c2410c; text-align: center; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #7a6a58; font-size: 0.9rem; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1100px; margin: 0 auto; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .box { background: #fff; border: 2px solid #ecd9bd; border-radius: 16px; padding: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .box h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid #ecd9bd; padding-bottom: 10px; }
  .row { padding: 12px 0; border-bottom: 1px solid #ecd9bd; display: flex; justify-content: space-between; align-items: center; }
  .row:last-child { border-bottom: 0; }
  .nm { font-weight: 700; font-size: 1.05rem; }
  .meta { color: #7a6a58; font-size: 0.85rem; margin-top: 4px; }
  .progress-container { width: 140px; }
  .progress-text { font-size: 0.75rem; color: #7a6a58; text-align: right; margin-bottom: 4px; }
  .progress { width: 100%; height: 8px; background: #ecd9bd; border-radius: 4px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: #c2410c; transition: width 0.5s ease; }
  .badge { display: inline-block; background: #c2410c; color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 0.75rem; font-weight: 700; margin-right: 5px; }
  .empty { color: #7a6a58; font-style: italic; text-align: center; padding: 20px 0; }
  
  /* CSS CHO PHẦN ĐĂNG NHẬP */
  #login-screen { display: flex; justify-content: center; align-items: center; height: 80vh; }
  .login-box { background: #fff; border: 2px solid #ecd9bd; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
  .login-box h2 { color: #c2410c; margin-top: 0; }
  .login-box input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #ecd9bd; border-radius: 8px; font-size: 1rem; }
  .login-box button { background: #c2410c; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
  .login-box button:hover { background: #9a3412; }
  .error-msg { color: #b91c1c; font-size: 0.9rem; margin-top: 10px; display: none; }
  
  #main-content { display: none; } /* Ẩn nội dung chính cho đến khi đăng nhập */
</style>
</head>
<body>

<!-- MÀN HÌNH ĐĂNG NHẬP -->
<div id="login-screen">
  <div class="login-box">
    <h2>🔒 Đăng Nhập Giáo Viên</h2>
    <p style="color:#7a6a58; font-size:0.9rem">Vui lòng nhập tài khoản để xem tiến độ học sinh</p>
    <input type="text" id="username" placeholder="Tên đăng nhập">
    <input type="password" id="password" placeholder="Mật khẩu">
    <button onclick="checkLogin()">Đăng Nhập</button>
    <p id="error-msg" class="error-msg">Tài khoản hoặc mật khẩu không đúng!</p>
  </div>
</div>

<!-- NỘI DUNG CHÍNH (BỊ ẨN) -->
<div id="main-content">
  <h1>👩‍🏫 Giám sát học sinh</h1>
  <p class="subtitle">Cập nhật real-time · Tự động ẩn học sinh ngừng hoạt động quá 5 phút</p>

  <div class="grid">
    <div class="box">
      <h2>📡 Đang làm bài</h2>
      <div id="live-panel">Đang tải dữ liệu...</div>
    </div>
    
    <div class="box">
      <h2>🏆 Bảng xếp hạng</h2>
      <div id="lb-panel">Đang tải dữ liệu...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ⚠️ THAY BẰNG CONFIG CỦA BẠN
const firebaseConfig = {
  apiKey: "AIzaSyAsT89zdpQwALQ0kmYta7mtwCXaj_yJc8Q",
  authDomain: "vuatiengviet-7a1cb.firebaseapp.com",
  projectId: "vuatiengviet-7a1cb",
  storageBucket: "vuatiengviet-7a1cb.firebasestorage.app",
  messagingSenderId: "563648012328",
  appId: "1:563648012328:web:9b6bdc3e45179dd90ed51d",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ==========================================
// XỬ LÝ ĐĂNG NHẬP
// ==========================================
window.checkLogin = function() {
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;
  
  // Tài khoản và mật khẩu của cô giáo
  if (user === 'dangthingoclan' && pass === 'ngoclannguvan') {
    // Đúng thì ẩn màn hình login, hiện nội dung chính
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    
    // Bắt đầu tải dữ liệu real-time
    startRealtimeData();
  } else {
    // Sai thì hiện thông báo lỗi
    document.getElementById('error-msg').style.display = 'block';
  }
};

// Cho phép bấm phím Enter để đăng nhập
document.getElementById('password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') window.checkLogin();
});

// ==========================================
// HÀM TẢI DỮ LIỆU (Chỉ chạy sau khi login)
// ==========================================
function startRealtimeData() {
  
  // 1. Lắng nghe tiến độ học sinh
  onSnapshot(collection(db, "active_sessions"), (snap) => {
    const now = new Date();
    const rows = [];
    
    snap.forEach(d => {
      const v = d.data();
      const last = v.lastUpdate?.toDate?.() || new Date(0);
      const recent = (now - last) < 5 * 60 * 1000; 
      
      if (v.status === "playing" && recent) {
        const pct = Math.round((v.currentQuestionIndex / v.totalQuestions) * 100);
        rows.push(`
          <div class="row">
            <div>
              <div class="nm">${esc(v.studentName)}</div>
              <div class="meta">Đang làm câu ${v.currentQuestionIndex}/${v.totalQuestions} · ${v.score} điểm</div>
            </div>
            <div class="progress-container">
              <div class="progress-text">${pct}%</div>
              <div class="progress"><i style="width:${pct}%"></i></div>
            </div>
          </div>
        `);
      }
    });
    
    document.getElementById('live-panel').innerHTML = rows.length 
      ? rows.join('') 
      : '<div class="empty">Không có học sinh nào đang làm bài.</div>';
  });

  // 2. Lắng nghe bảng xếp hạng
  const lbQuery = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
  onSnapshot(lbQuery, (snap) => {
    const rows = []; 
    let rank = 0;
    
    snap.forEach(d => {
      const v = d.data(); 
      rank++;
      
      let badgeColor = "#c2410c";
      if (rank === 1) badgeColor = "#eab308"; // Vàng
      if (rank === 2) badgeColor = "#94a3b8"; // Bạc
      if (rank === 3) badgeColor = "#b45309"; // Đồng

      rows.push(`
        <div class="row">
          <div>
            <span class="badge" style="background:${badgeColor}">#${rank}</span> 
            <span class="nm">${esc(v.name)}</span>
          </div>
          <div class="meta" style="text-align:right">
            <b>${v.score}</b> điểm<br>
            Đúng ${v.correct}/${v.total} câu
          </div>
        </div>
      `);
    });
    
    document.getElementById('lb-panel').innerHTML = rows.length 
      ? rows.join('') 
      : '<div class="empty">Chưa có ai trên bảng xếp hạng.</div>';
  });
}
</script>
</body>
</html>
